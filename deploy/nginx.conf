# One origin: the built PWA (web/dist-aws) plus the Laravel API under /api and /sanctum.
# TLS terminates at the AWS load balancer; this listens on plain HTTP inside the private subnet.
server {
    listen 8080 default_server;
    server_name _;
    root /srv/web;
    server_tokens off;
    client_max_body_size 26m;  # 25 MB attachments + form overhead

    # Security headers for the PWA (the API sets its own, stricter ones).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ~ ^/(api|sanctum)/ {
        try_files /dev/null @php;
    }
    location = /up { try_files /dev/null @php; }

    location @php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/api/public;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # The service worker and app shell must always be revalidated so updates reach phones.
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    location / {
        try_files $uri /index.html;
    }

    # Never serve dotfiles or anything outside the two trees.
    location ~ /\. { deny all; }
}
